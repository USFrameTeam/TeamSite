<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USF V1-USFrameTeam 官方网站</title>
    <!-- Y: 临时使用，后续转框架的时候不会使用CDN了 2026-07-01 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/v2_new.css">
</head>
<body class="text-neutral-100 antialiased min-h-screen flex flex-col p-4 md:p-6 max-w-7xl mx-auto w-full">

    <main class="flex-grow flex flex-col space-y-16 md:space-y-28">

        <section class="relative w-full rounded-[2.5rem] overflow-hidden bg-[#121214] flex flex-col items-center px-6 py-20 md:px-20 md:py-28 opacity-0 animate-hero-card">
            <div class="relative z-20 w-full flex flex-col items-center text-center space-y-6">
                <div class="inline-block px-4 py-1.5 bg-red-500/20 border border-red-500/40 rounded-full text-red-400 text-xs font-medium tracking-wide">
                    已停止维护
                </div>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tighter text-white leading-[1.15] text-glow">
                    无名氏服务器<br class="hidden md:block">管理框架 <span class="font-light text-neutral-300">V1</span>
                </h1>
                <p class="text-base md:text-lg text-neutral-400 font-light leading-relaxed max-w-md">
                    USFV1 已停止官方支持，不再对新版本进行适配。请迁移至 USFV2。
                </p>
                <div class="flex items-center gap-4 pt-2">
                    <a href="usfv2.html" class="inline-flex items-center justify-center px-6 py-2.5 bg-white text-black text-sm font-bold rounded-full hover:bg-neutral-200 transition-all">
                        前往 USFV2
                    </a>
                    <a href="https://github.com/USFrameTeam/Unknown-Server-Framework" target="_blank" rel="noopener" class="inline-flex items-center justify-center px-6 py-2.5 border border-white/20 bg-white/5 hover:bg-white/10 text-white text-sm font-medium rounded-full transition-all">
                        GitHub
                    </a>
                </div>
            </div>
        </section>

        <section class="reveal w-full px-4 md:px-6">
            <div class="relative w-full rounded-[2.5rem] overflow-hidden bg-gradient-to-br from-[#161618] to-[#0d0d0e] border border-white/[0.06] p-8 md:p-14 flex flex-col items-center text-center space-y-5">
                <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-white leading-tight">
                    关于 USFV1
                </h2>
                <p class="text-sm md:text-base text-neutral-400 font-light max-w-lg leading-relaxed">
                    USFV1 是基于 ScriptAPI 的简易 Minecraft BE 服务器管理框架。作为 USF 的初代版本，它曾为大量服务器提供基础管理能力。现已被 USFV2 取代。
                </p>
                <div class="flex flex-row items-center justify-center gap-4 pt-3">
                    <a href="https://usfdoc.pages.dev/" target="_blank" rel="noopener" class="inline-flex items-center justify-center px-4 sm:px-6 py-2.5 border border-white/20 bg-white/5 hover:bg-white/10 text-white text-xs md:text-sm font-medium rounded-full transition-all">
                        查阅文档
                    </a>
                    <a href="https://d.usframeteam.top/" target="_blank" rel="noopener" class="inline-flex items-center justify-center px-4 sm:px-6 py-2.5 bg-white text-black text-xs md:text-sm font-bold rounded-full hover:bg-neutral-200 transition-all">
                        立刻下载
                    </a>
                </div>
            </div>
        </section>

    </main>

    <script src="static/components/header.js"></script>
    <script src="static/components/footer.js"></script>
    <script src="static/components/common.js"></script>
    <script>
        renderHeader({
            actionButton: '<a href="usfv2.html" class="inline-flex items-center border border-white/20 px-4 py-1.5 rounded-[2.5rem] text-xs hover:bg-white hover:text-black transition-all duration-300 font-medium"><span>前往新版</span></a>'
        });
        renderFooter();
        initCommon();
    </script>
</body>
</html>
